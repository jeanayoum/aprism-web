<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — APRISM</title>
  <meta name="description" content="APRISM 공장 환경점검 로봇 관제 시스템 로그인" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css" />
  <link rel="stylesheet" href="../assets/css/tokens.css?v=22bec66d" />
  <link rel="stylesheet" href="../assets/css/app-shell.css?v=60434960" />
  <link rel="stylesheet" href="../assets/css/auth.css?v=e4c91952" />
  <link rel="stylesheet" href="../assets/css/components-v7.css?v=09fa0998" />   
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-family-sans);
      -webkit-font-smoothing: antialiased;
    }
</style>
</head>
<body class="ds-auth">

<div class="auth auth-login">

  <section class="auth-brand" aria-label="APRISM">
    <div class="brand-block">
      <span class="brand-logo" role="img" aria-label="APRISM">
        <img class="brand-logo-dark" src="../assets/img/logo/aprism-dark.svg" alt="" />
        <img class="brand-logo-light" src="../assets/img/logo/aprism.svg" alt="" />
      </span>

      <p class="brand-claim">APRO ROBOT INTELLIGENT SITE MANAGEMENT</p>
    </div>
  </section>

  <div class="auth-panel">

    <form class="login-card" data-login-form novalidate>

      <div class="login-head">
        <h1 class="t-heading-2">로그인</h1>
        <p class="t-body-3">등록된 계정으로 관제 시스템에 접속합니다.</p>
      </div>

      <div class="login-fields">

        <div class="field">
          <label class="field-label" for="login-id">아이디</label>
          <div class="field-box">
            <span class="i i-20 lead" style="--i:var(--ic-user)" aria-hidden="true"></span>
            <input type="text" id="login-id" name="username" autocomplete="username"
                   placeholder="사번 또는 아이디를 입력하세요" />
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="login-pw">비밀번호</label>
          <div class="field-box">
            <span class="i i-20 lead" style="--i:var(--ic-lock)" aria-hidden="true"></span>
            <input type="password" id="login-pw" name="password" autocomplete="current-password"
                   placeholder="비밀번호를 입력하세요" />
            <button type="button" class="pw-toggle ds-auth-iconbtn" data-pw-toggle
                    aria-pressed="false" aria-controls="login-pw" aria-label="비밀번호 보기">
              <span class="i i-20" aria-hidden="true"></span>
            </button>
          </div>
        </div>

        <div class="login-options">
          <label class="checkbox t-body-3">
            <input type="checkbox" name="remember" />
            <span class="box" aria-hidden="true"><span class="i"></span></span>
            <span>자동 로그인</span>
          </label>
        </div>

      </div>

      <button type="submit" class="login-submit is-accent ds-auth-btn">로그인</button>

      <div class="login-help">
        <hr />
        <p class="t-caption">계정 발급과 잠금 해제 문의: 설비운영팀 내선 2400</p>
      </div>

      <p class="login-copyright t-caption">ⓒ 2026 APRISM<br>모든 접속 기록은 감사 로그에 저장됩니다.</p>

    </form>

  </div>

</div>

<script src="../assets/js/theme.js?v=98dea82f"></script>
<script src="../assets/js/auth.js?v=cf84f0fc"></script>
</body>
</html>
