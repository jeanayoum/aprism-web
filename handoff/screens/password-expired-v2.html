<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 변경 — APRISM</title>
  <meta name="description" content="APRISM 비밀번호 사용 기간 만료 — 비밀번호 변경 강제" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css" />
  <link rel="stylesheet" href="../assets/css/tokens.css?v=f2166588" />
  <link rel="stylesheet" href="../assets/css/app-shell.css?v=bd279685" />
  <link rel="stylesheet" href="../assets/css/auth.css?v=e69bc90e" />
  <link rel="stylesheet" href="../assets/css/components-v7.css?v=c7c0a86d" />   
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-family-sans);
      -webkit-font-smoothing: antialiased;
    }
</style>
</head>
<body class="ds-auth">

<div class="auth auth-login">

  <section class="auth-brand" aria-label="APRISM">
    <div class="brand-block">
      <span class="brand-logo" role="img" aria-label="APRISM">
        <img class="brand-logo-dark" src="../assets/img/logo/aprism-dark.svg" alt="" />
        <img class="brand-logo-light" src="../assets/img/logo/aprism.svg" alt="" />
      </span>

      <p class="brand-claim">APRO ROBOT INTELLIGENT SITE MANAGEMENT</p>
    </div>
  </section>

  <div class="auth-panel is-centered">
    <div class="auth-stack">

      <form class="login-card" data-password-form novalidate>

        <div class="login-head">
          <h1 class="t-heading-2">비밀번호 변경</h1>
          <p class="t-body-3">정기 변경 주기가 지나 비밀번호를 변경해야 합니다.</p>

          <div class="inline-notice ds-notice is-warning">
            <span class="i i-16" style="--i:var(--ic-warning)" aria-hidden="true"></span>
            <span class="body">
              <span class="title">비밀번호 사용 기간이 지났어요</span>
              <span class="desc">마지막 변경일 2026-05-28<br />변경 주기 90일<br />보안을 위해 새 비밀번호를 정해 주세요.</span>
            </span>
          </div>
        </div>

        <div class="login-fields">

          <div class="field">
            <label class="field-label" for="pwx-current">현재 비밀번호 <span class="req" aria-hidden="true">*</span></label>
            <div class="field-box">
              <span class="i i-20 lead" style="--i:var(--ic-lock)" aria-hidden="true"></span>
              <input type="password" id="pwx-current" name="currentPassword" autocomplete="current-password"
                     placeholder="현재 비밀번호를 입력하세요" data-pwx-current />
              <button type="button" class="pw-toggle ds-auth-iconbtn" data-pw-toggle
                      aria-pressed="false" aria-controls="pwx-current" aria-label="비밀번호 보기">
                <span class="i i-20" aria-hidden="true"></span>
              </button>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="pwx-new">새 비밀번호 <span class="req" aria-hidden="true">*</span></label>
            <div class="field-box">
              <span class="i i-20 lead" style="--i:var(--ic-lock)" aria-hidden="true"></span>
              <input type="password" id="pwx-new" name="newPassword" autocomplete="new-password"
                     placeholder="새 비밀번호를 입력하세요" data-pwx-new />
              <button type="button" class="pw-toggle ds-auth-iconbtn" data-pw-toggle
                      aria-pressed="false" aria-controls="pwx-new" aria-label="비밀번호 보기">
                <span class="i i-20" aria-hidden="true"></span>
              </button>
            </div>
          </div>

          <div class="field" data-pwx-confirm-field>
            <label class="field-label" for="pwx-confirm">새 비밀번호 확인 <span class="req" aria-hidden="true">*</span></label>
            <div class="field-box">
              <span class="i i-20 lead" style="--i:var(--ic-lock)" aria-hidden="true"></span>
              <input type="password" id="pwx-confirm" name="confirmPassword" autocomplete="new-password"
                     placeholder="새 비밀번호를 다시 입력하세요" aria-describedby="pwx-confirm-help"
                     data-pwx-confirm />
              <button type="button" class="pw-toggle ds-auth-iconbtn" data-pw-toggle
                      aria-pressed="false" aria-controls="pwx-confirm" aria-label="비밀번호 보기">
                <span class="i i-20" aria-hidden="true"></span>
              </button>
              <span class="i i-20 field-alert" style="--i:var(--ic-warning)" aria-hidden="true"></span>
            </div>
            <p class="field-helper t-caption" id="pwx-confirm-help" data-pwx-confirm-help role="alert" hidden>
              새 비밀번호와 같지 않아요.
            </p>
          </div>

          <ul class="pw-rules" aria-live="polite">
            <li class="pw-rule t-body-3" data-rule="length">
              <span class="i i-20" style="--i:var(--ic-check)" aria-hidden="true"></span>
              <span>8자 이상</span>
            </li>
            <li class="pw-rule t-body-3" data-rule="kinds">
              <span class="i i-20" style="--i:var(--ic-check)" aria-hidden="true"></span>
              <span>영문 숫자 특수문자 중 2종 이상</span>
            </li>
            <li class="pw-rule t-body-3" data-rule="notid">
              <span class="i i-20" style="--i:var(--ic-check)" aria-hidden="true"></span>
              <span>아이디와 3자 이상 연속 일치 금지</span>
            </li>
            <li class="pw-rule t-body-3" data-rule="notreused">
              <span class="i i-20" style="--i:var(--ic-check)" aria-hidden="true"></span>
              <span>최근 3개 비밀번호와 중복 금지</span>
            </li>
          </ul>

        </div>

        <button type="submit" class="login-submit is-accent ds-auth-btn" disabled data-pwx-submit>변경하고 시작하기</button>

        <div class="login-help">
          <hr />
          <p class="t-caption">계정 발급과 잠금 해제 문의: 설비운영팀 내선 2400</p>
        </div>

      </form>

      <a class="auth-switch is-quiet ds-auth-ghost" href="./login-v2.html">다른 계정으로 로그인</a>

    </div>
  </div>

</div>

<script src="../assets/js/theme.js?v=98dea82f"></script>
<script src="../assets/js/auth.js?v=cf84f0fc"></script>
</body>
</html>
